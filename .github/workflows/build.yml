name: Build Atari Classic (Signed APK + AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare keystore (alias must be upload)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "ERROR: KEYSTORE_BASE64 is empty or invalid"; exit 1; }
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -alias upload -storepass:env KS_PASS >/dev/null 2>&1; then
            keytool -changealias -keystore "$RUNNER_TEMP/release.jks" \
              -alias "$KEY_ALIAS" -destalias upload \
              -storepass:env KS_PASS -keypass:env KEY_PASS
          fi
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -alias upload -storepass:env KS_PASS

      - name: Build release (APK + AAB)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show failure reason
        if: failure()
        run: |
          echo "=============== WHAT WENT WRONG ==============="
          grep -n -A 12 "What went wrong" build.log | head -50 || true
          echo "=============== ERRORS ==============="
          grep -n -E "^e: |error:|FAILED|Could not|Unsupported|not found" build.log | head -30 || true

      - name: Collect and verify outputs
        run: |
          mkdir -p out
          APK=$(find . -path "*outputs/apk/release*" -name "*.apk" | head -1)
          AAB=$(find . -path "*outputs/bundle/release*" -name "*.aab" | head -1)
          echo "APK=$APK"
          echo "AAB=$AAB"
          test -n "$APK" || { echo "ERROR: no APK produced"; exit 1; }
          cp "$APK" out/AtariClassic.apk
          [ -z "$AAB" ] || cp "$AAB" out/AtariClassic.aab
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs out/AtariClassic.apk

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: atari-classic-release
          path: out/*

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
