name: Build Atari Classic (Signed APK + AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: "Atari Classic"
  APP_ID: "com.hala.atariclassic"
  WEB_DIR: "dist"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web app
        run: npm run build

      - name: Setup Capacitor
        run: |
          npm ls @capacitor/core >/dev/null 2>&1 || npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "$APP_NAME" "$APP_ID" --web-dir="$WEB_DIR"
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          OUT=android/app/build/outputs/apk/release
          UNSIGNED=$(ls $OUT/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$OUT/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out "$OUT/AtariClassic-signed.apk" "$OUT/aligned.apk"
          "$BT/apksigner" verify "$OUT/AtariClassic-signed.apk"

      - name: Sign AAB
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          jarsigner -keystore "$RUNNER_TEMP/release.jks" \
            -storepass:env KS_PASS -keypass:env KEY_PASS \
            "$AAB" "$KEY_ALIAS"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atari-classic-release
          path: |
            android/app/build/outputs/apk/release/AtariClassic-signed.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
