name: Build Atari Classic (Signed APK + AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Decode and verify keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "ERROR: KEYSTORE_BASE64 is empty or invalid"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -alias "$KEY_ALIAS" -storepass:env KS_PASS
          for f in keystore.properties app/keystore.properties; do
            printf "storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$RUNNER_TEMP/release.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > "$f"
          done

      - name: Build release (APK + AAB)
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show failure reason
        if: failure()
        run: |
          echo "=============== WHAT WENT WRONG ==============="
          grep -n -A 12 "What went wrong" build.log | head -50 || true
          echo "=============== ERRORS ==============="
          grep -n -E "^e: |error:|FAILED|Could not|Unsupported|not found" build.log | head -30 || true

      - name: Sign APK and AAB
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p out
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=$(find . -path "*outputs/apk/release*" -name "*.apk" | head -1)
          AAB=$(find . -path "*outputs/bundle/release*" -name "*.aab" | head -1)
          echo "APK=$APK"
          echo "AAB=$AAB"
          test -n "$APK" || { echo "ERROR: no APK produced"; exit 1; }
          "$BT/zipalign" -p -f 4 "$APK" out/aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out out/AtariClassic-signed.apk out/aligned.apk
          "$BT/apksigner" verify out/AtariClassic-signed.apk
          rm -f out/aligned.apk
          if [ -n "$AAB" ]; then
            cp "$AAB" out/AtariClassic.aab
            jarsigner -keystore "$RUNNER_TEMP/release.jks" \
              -storepass:env KS_PASS -keypass:env KEY_PASS \
              out/AtariClassic.aab "$KEY_ALIAS"
          fi

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: atari-classic-release
          path: out/*

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties app/keystore.properties
