
name: Build Atari Classic (Signed APK + AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: "Atari Classic"
  APP_ID: "com.hala.atariclassic"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app
        run: |
          if [ -f package.json ]; then
            npm install
            if npm run | grep -q " build"; then npm run build; fi
            if [ ! -d dist ] && [ -d build ]; then mv build dist; fi
          else
            mkdir -p dist
            rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' --exclude='dist' ./ dist/
          fi
          test -f dist/index.html || { echo "ERROR: dist/index.html not found"; ls -la; exit 1; }

      - name: Setup Capacitor
        run: |
          [ -f package.json ] || npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "$APP_NAME" "$APP_ID" --web-dir=dist
          fi
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Decode and verify keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "ERROR: KEYSTORE_BASE64 secret is empty or invalid"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -alias "$KEY_ALIAS" -storepass:env KS_PASS

      - name: Build release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          OUT=android/app/build/outputs/apk/release
          UNSIGNED=$(ls $OUT/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$OUT/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out "$OUT/AtariClassic-signed.apk" "$OUT/aligned.apk"
          "$BT/apksigner" verify "$OUT/AtariClassic-signed.apk"

      - name: Sign AAB
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          jarsigner -keystore "$RUNNER_TEMP/release.jks" \
            -storepass:env KS_PASS -keypass:env KEY_PASS \
            "$AAB" "$KEY_ALIAS"

      - uses: actions/upload-artifact@v4
        with:
          name: atari-classic-release
          path: |
            android/app/build/outputs/apk/release/AtariClassic-signed.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
