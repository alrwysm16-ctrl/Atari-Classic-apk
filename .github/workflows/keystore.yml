name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      password:
        description: "كلمة السر (6 أحرف فأكثر، بدون مسافات)"
        required: true
      alias:
        description: "Alias"
        default: "myalias"
        required: true

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        env:
          PW: ${{ inputs.password }}
          AL: ${{ inputs.alias }}
        run: |
          keytool -genkeypair -keystore release.jks -alias "$AL" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Atari Classic, O=Hala, C=SA"
          base64 -w 0 release.jks > keystore_base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            release.jks
            keystore_base64.txt
